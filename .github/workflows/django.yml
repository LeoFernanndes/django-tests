name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ENVIRONMENT: "local"
  S3_LOCAL_BUCKET_HOST: "http://127.0.0.1:9000/"
  S3_LOCAL_KEYID: "AKIAIOSFODNN7EXAMPLE"
  S3_LOCAL_KEYSECRET: "wJalrXUtnFEMIK7MDENGbPxRfiCYEXAMPLEKEY" 
  AWS_REGION: "us-east-1"
  USER_PROFILE_IMAGES_BUCKET: "user-profile-images"
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password"
  POSTGRES_HOST: "localhost"
  POSTGRES_PORT: "5432"

jobs:
  build:

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11.9]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run migrations
      run: |
        python manage.py migrate
    - name: Run Tests
      run: |
        python manage.py test
